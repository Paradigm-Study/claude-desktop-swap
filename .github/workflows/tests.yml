name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cloudflare:
    name: Cloudflare coordinator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
  test:
    name: Offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install native team pilot dependencies
        run: python -m pip install -e .
      - name: Test without optional claude-swap dependency
        run: python -m unittest discover -s tests -v
      - name: Install pinned upstream for quota regression tests
        run: python -m pip install 'claude-swap==0.26.0'
      - name: Test with upstream dependency
        run: python -m unittest discover -s tests -v
